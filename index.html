<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Encuentra tu Grupo Scout — Valparaíso</title>
<meta name="description" content="Mapa interactivo para encontrar los grupos scout de Valparaíso, Chile.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<style>
  :root{
    --paper: #efe6ce;
    --paper-dark: #e2d6b3;
    --ink: #23281d;
    --navy: #16323f;
    --navy-deep: #0e232c;
    --khaki: #4a5d3a;
    --khaki-dark: #37472c;
    --gold: #c68a2e;
    --terracotta: #a8452f;
    --line: rgba(35,40,29,0.16);
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html,body{
    margin:0; padding:0; height:100%;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    overscroll-behavior: none;
  }

  body{
    background-image:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,0.35), transparent 45%),
      radial-gradient(circle at 90% 80%, rgba(0,0,0,0.05), transparent 40%);
  }

  .app{
    display:flex;
    flex-direction:column;
    height:100vh;
    height:100dvh;
  }

  /* ---------- HEADER ---------- */
  header{
    background: var(--navy-deep);
    padding: 0;
    position:relative;
    border-bottom: 3px solid var(--gold);
    flex: 0 0 auto;
    z-index: 20;
    line-height: 0;
  }

  header img.banner{
    display:block;
    width: 100%;
    height: auto;
    max-height: 22vh;
    object-fit: cover;
  }

  /* ---------- INSTRUCTION STRIP ---------- */
  .instruction{
    max-width: 1100px;
    margin: 0 auto;
    padding: 8px 16px;
    font-family:'IBM Plex Mono', monospace;
    font-size: 11.5px;
    line-height: 1.35;
    color: var(--khaki-dark);
    display:flex;
    align-items:flex-start;
    gap:7px;
    flex: 0 0 auto;
  }
  .instruction svg{ flex:0 0 auto; margin-top: 1px; }

  /* ---------- MAP ---------- */
  .map-wrap{ flex: 1 1 auto; position: relative; min-height: 0; }
  #map{ width:100%; height:100%; }

  .leaflet-container{
    background: #dfe7de;
    font-family: 'Inter', sans-serif;
  }

  .scout-pin{
    filter: drop-shadow(0 3px 3px rgba(0,0,0,0.35));
    transform-origin: 50% 100%;
    transition: transform .15s ease;
  }
  .leaflet-marker-icon:hover .scout-pin{ transform: scale(1.08); }
  .leaflet-marker-icon{ cursor: pointer; }

  .leaflet-popup-content-wrapper{
    background: var(--paper);
    border-radius: 8px;
    box-shadow: 0 10px 30px rgba(14,35,44,0.35);
    border: 1px solid var(--line);
    overflow: hidden;
    padding: 0;
  }
  .leaflet-popup-tip{ background: var(--paper); }
  .leaflet-popup-content{
    margin: 0;
    width: min(260px, 82vw) !important;
    max-height: 72vh;
    overflow-y: auto;
    overflow-x: hidden;
  }
  .leaflet-popup-close-button{
    color: var(--paper) !important;
    background: rgba(14,35,44,0.55) !important;
    border-radius: 50%;
    font-size: 20px !important;
    line-height: 30px !important;
    padding: 0 !important;
    width: 30px !important;
    height: 30px !important;
    top: 8px !important;
    right: 8px !important;
  }

  .flyer-card{ display:flex; flex-direction:column; }
  .flyer-img{ display:block; width:100%; height:auto; }
  .flyer-card a.social{
    display:flex; align-items:center; justify-content:center; gap: 7px;
    font-family:'IBM Plex Mono', monospace;
    font-size: 13px; font-weight: 600;
    text-decoration: none; color: var(--paper);
    background: var(--khaki);
    padding: 12px 14px;
    letter-spacing: 0.02em;
  }
  .flyer-card a.social:hover{ background: var(--khaki-dark); }
  .flyer-card a.social svg{ width:15px; height:15px; flex:0 0 auto; }

  .leaflet-touch .leaflet-control-zoom a{
    width: 38px !important;
    height: 38px !important;
    line-height: 38px !important;
    font-size: 18px !important;
  }
  .leaflet-control-attribution{ font-size: 9.5px !important; }

  footer{
    flex: 0 0 auto;
    background: var(--navy-deep);
    color: rgba(239,230,206,0.6);
    font-family:'IBM Plex Mono', monospace;
    font-size: 9.5px;
    text-align:center;
    padding: 6px 10px;
    padding-bottom: max(6px, env(safe-area-inset-bottom));
    letter-spacing: 0.03em;
  }
  footer a{ color: rgba(239,230,206,0.85); }

  @media (max-width: 480px){
    header img.banner{ max-height: 16vh; }
    .instruction{ font-size: 11px; padding: 7px 12px; }
    footer{ display: none; }

    /* Flyer 30% más chico en móvil: 260px*0.7=182px, 82vw*0.7≈57vw */
    .leaflet-popup-content{ width: min(182px, 57vw) !important; }
  }
</style>
</head>
<body>

<div class="app">

  <header>
    <img class="banner" src="banner.png" alt="Encuentra tu Grupo Scout en Valparaíso — Agrupación Nacional de Boy Scouts de Chile, Localidad de Valparaíso">
  </header>

  <div class="instruction">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.1-7-11a7 7 0 0 1 14 0c0 4.9-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
    Toca un pin para ver la sede, el colegio y el contacto de cada grupo.
  </div>

  <div class="map-wrap">
    <div id="map"></div>
  </div>

  <footer>
    Mapa © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> colaboradores
  </footer>

</div>

<script>
  // ---- Datos de los grupos scout ----
  // Nota: la ubicación de "Aquitania" es aproximada porque no se encontró
  // una dirección exacta publicada. Ajusta lat/lng si tienes el dato real.
  const grupos = [
    {
      nombre: "Grupo Scout Capitán Aquiles Ramírez",
      lugar: "Escuela Grecia",
      lat: -33.047194,
      lng: -71.611164,
      flyer: "flyers/car.jpg",
      social: { tipo: "instagram", url: "https://www.instagram.com/capitanaquilesramirez/" }
    },
    {
      nombre: "Grupo Scout Blas Cuevas",
      lugar: "Escuela Blas Cuevas",
      lat: -33.039491,
      lng: -71.634467,
      flyer: "flyers/blascuevas.jpg",
      social: { tipo: "instagram", url: "https://www.instagram.com/gs_blascuevas/" }
    },
    {
      nombre: "Grupo Scout Antumañke",
      lugar: "Liceo Alfredo Nazar, Playa Ancha",
      lat: -33.027755,
      lng: -71.638435,
      flyer: "flyers/antumanke.jpg",
      social: { tipo: "instagram", url: "https://www.instagram.com/grupo_antumanke/" }
    },
    {
      nombre: "Grupo Scout Gaspar Cabrales",
      lugar: "Colegio Premilitar Víctor Antonio, Playa Ancha",
      lat: -33.030940,
      lng: -71.639150,
      flyer: "flyers/gaspar.jpg",
      social: { tipo: "instagram", url: "https://www.instagram.com/gsgasparcabrales/" }
    },
    {
      nombre: "Grupo Scout Aquitania",
      lugar: "Escuela República Argentina",
      lat: -33.045022,
      lng: -71.626641,
      flyer: "flyers/aquitania.jpg",
      social: { tipo: "facebook", url: "https://www.facebook.com/gruposcoutaquitaniadevalparaiso" }
    }
  ];

  // ---- Icono personalizado tipo "sello scout" ----
  function pinIcon(){
    const svg = `
      <svg class="scout-pin" width="40" height="52" viewBox="0 0 40 52" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 51C20 51 2 30.5 2 19C2 8.5 10.06 1 20 1C29.94 1 38 8.5 38 19C38 30.5 20 51 20 51Z"
              fill="#a8452f" stroke="#efe6ce" stroke-width="2"/>
        <circle cx="20" cy="19" r="12.5" fill="#efe6ce"/>
        <path d="M20 9 C22.6 14 27 15 27 19 C27 23 22.6 24 20 29 C17.4 24 13 23 13 19 C13 15 17.4 14 20 9 Z"
              fill="#4a5d3a"/>
      </svg>`;
    return L.divIcon({
      html: svg,
      className: "",
      iconSize: [40, 52],
      iconAnchor: [20, 50],
      popupAnchor: [0, -46]
    });
  }

  const igSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>`;
  const fbSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>`;

  function cardHtml(g){
    const isIg = g.social.tipo === "instagram";
    const label = isIg ? "Ver en Instagram" : "Ver en Facebook";
    const icon = isIg ? igSvg : fbSvg;
    return `
      <div class="flyer-card">
        <img class="flyer-img" src="${g.flyer}" alt="Afiche ${g.nombre}" loading="lazy">
        <a class="social" href="${g.social.url}" target="_blank" rel="noopener">${icon}${label}</a>
      </div>`;
  }

  // ---- Vista inicial: centrada en Valparaíso, sin límites de movimiento ----
  const valpoBounds = L.latLngBounds(
    L.latLng(-33.070, -71.660),  // suroeste
    L.latLng(-33.005, -71.590)   // noreste
  );

  const map = L.map('map', {
    zoomControl: false,
    scrollWheelZoom: true
  }).fitBounds(valpoBounds);

  L.control.zoom({ position: 'bottomright' }).addTo(map);

  // Tiles de OpenStreetMap: gratuitos, sin necesidad de API key
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  const markers = [];
  grupos.forEach(g => {
    const m = L.marker([g.lat, g.lng], { icon: pinIcon() })
      .addTo(map)
      .bindPopup(cardHtml(g), { autoPanPadding: [20, 60] });
    markers.push(m);
  });

  // Encuadra los pines sin salir del área permitida de Valparaíso
  // (pad más grande = abre con menos zoom / vista más alejada)
  const group = L.featureGroup(markers);
  map.fitBounds(group.getBounds().pad(0.9));
</script>

</body>
</html>
